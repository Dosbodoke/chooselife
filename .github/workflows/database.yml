name: Database

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
      - 'supabase/seeds/**'
      - 'supabase/tests/**'
      - 'supabase/schemas/**'
      - 'supabase/verification/**'
      - 'scripts/verify-database.mjs'
      - 'scripts/verify-database.test.mjs'
      - 'scripts/check-database-catalog.mjs'
      - 'scripts/check-database-catalog.test.mjs'
      - 'scripts/supabase-gen-types.test.mjs'
      - 'supabase-gen-types.sh'
      - 'packages/database/**'
      # Formatter configuration that shapes the generated artifact.
      - '.editorconfig'
      - '.prettierrc*'
      - '.prettierignore'
      - 'prettier.config.*'
      # Modules that re-export or import the generated types directly.
      - 'supabase/functions/_shared/database.types.ts'
      - 'expo/utils/database.types.ts'
      - 'next/utils/supabase/database.types.ts'
      - 'next/app/api/courses/highline-beginner/access/route.ts'
      - 'next/app/\[locale\]/highline/\[id\]/opengraph-image.tsx'
      - 'next/app/\[locale\]/news/\[newsSlug\]/opengraph-image.tsx'
      - 'next/app/\[locale\]/news/\[newsSlug\]/page.tsx'
      - 'next/app/sitemap.ts'
      - 'next/lib/billing-workspace.ts'
      - 'next/lib/initial-payment-claims.ts'
      - 'packages/ui/src/supabase-provider.tsx'
      - 'packages/ui/src/feature/calendar/use-events.ts'
      - 'packages/ui/src/feature/festival/api.ts'
      - 'packages/ui/src/feature/festival/types.ts'
      - 'packages/ui/src/feature/rig-setup/use-rigger-profiles.ts'
      - 'packages/ui/src/feature/webbing/types.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.github/workflows/database.yml'
  push:
    branches: [main, develop]
    paths:
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
      - 'supabase/seeds/**'
      - 'supabase/tests/**'
      - 'supabase/schemas/**'
      - 'supabase/verification/**'
      - 'scripts/verify-database.mjs'
      - 'scripts/verify-database.test.mjs'
      - 'scripts/check-database-catalog.mjs'
      - 'scripts/check-database-catalog.test.mjs'
      - 'scripts/supabase-gen-types.test.mjs'
      - 'supabase-gen-types.sh'
      - 'packages/database/**'
      # Formatter configuration that shapes the generated artifact.
      - '.editorconfig'
      - '.prettierrc*'
      - '.prettierignore'
      - 'prettier.config.*'
      # Modules that re-export or import the generated types directly.
      - 'supabase/functions/_shared/database.types.ts'
      - 'expo/utils/database.types.ts'
      - 'next/utils/supabase/database.types.ts'
      - 'next/app/api/courses/highline-beginner/access/route.ts'
      - 'next/app/\[locale\]/highline/\[id\]/opengraph-image.tsx'
      - 'next/app/\[locale\]/news/\[newsSlug\]/opengraph-image.tsx'
      - 'next/app/\[locale\]/news/\[newsSlug\]/page.tsx'
      - 'next/app/sitemap.ts'
      - 'next/lib/billing-workspace.ts'
      - 'next/lib/initial-payment-claims.ts'
      - 'packages/ui/src/supabase-provider.tsx'
      - 'packages/ui/src/feature/calendar/use-events.ts'
      - 'packages/ui/src/feature/festival/api.ts'
      - 'packages/ui/src/feature/festival/types.ts'
      - 'packages/ui/src/feature/rig-setup/use-rigger-profiles.ts'
      - 'packages/ui/src/feature/webbing/types.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.github/workflows/database.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test verification helpers
        run: node --test scripts/verify-database.test.mjs scripts/check-database-catalog.test.mjs scripts/supabase-gen-types.test.mjs

      # Disposable Supabase stack only: no link, push, deploy or secrets.
      # Fails on a missing or invalid catalog capture and on any difference
      # between the generated types and the tracked artifact.
      - name: Verify migrations, seeds, catalog, lint, pgTAP tests and types
        run: pnpm db:verify --check-types

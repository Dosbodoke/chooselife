name: Database

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
      - 'supabase/seeds/**'
      - 'supabase/tests/**'
      - 'supabase/schemas/**'
      - 'supabase/verification/**'
      - 'scripts/verify-database.mjs'
      - 'scripts/verify-database.test.mjs'
      - 'supabase-gen-types.sh'
      - 'packages/database/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.github/workflows/database.yml'
  push:
    branches: [main, develop]
    paths:
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
      - 'supabase/seeds/**'
      - 'supabase/tests/**'
      - 'supabase/schemas/**'
      - 'supabase/verification/**'
      - 'scripts/verify-database.mjs'
      - 'scripts/verify-database.test.mjs'
      - 'supabase-gen-types.sh'
      - 'packages/database/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.github/workflows/database.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test verification helpers
        run: node --test scripts/verify-database.test.mjs

      # Disposable Supabase stack only: no link, push, deploy or secrets.
      # Type parity is not checked here until Plan 003 regenerates the types.
      - name: Verify migrations, seeds, lint and pgTAP tests
        run: pnpm db:verify
